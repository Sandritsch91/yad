<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>yad: Bootstrap 5 theme</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
  <div class="container py-4" style="max-width: 760px">
    <div class="d-flex align-items-center justify-content-between mb-4">
      <h1 class="h3 mb-0">yad, Bootstrap 5 theme</h1>
      <div class="btn-group btn-group-sm" role="group" aria-label="Theme">
        <input type="radio" class="btn-check" name="theme" id="theme-light" value="light" autocomplete="off">
        <label class="btn btn-outline-secondary" for="theme-light">Light</label>
        <input type="radio" class="btn-check" name="theme" id="theme-dark" value="dark" autocomplete="off">
        <label class="btn btn-outline-secondary" for="theme-dark">Dark</label>
        <input type="radio" class="btn-check" name="theme" id="theme-auto" value="auto" autocomplete="off">
        <label class="btn btn-outline-secondary" for="theme-auto">Auto</label>
      </div>
    </div>

    <div class="row g-4">
      <div class="col-md-6">
        <label class="form-label" for="basic">Popup</label>
        <input class="form-control" id="basic" placeholder="mm/dd/yyyy">
      </div>
      <div class="col-md-6">
        <label class="form-label" for="group">In an input group with trigger button</label>
        <div class="input-group">
          <input class="form-control" id="group">
        </div>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="full">Dropdowns, button panel, week numbers</label>
        <input class="form-control" id="full">
      </div>
      <div class="col-md-6">
        <label class="form-label" for="range">Today to +2 months, no weekends</label>
        <input class="form-control" id="range">
      </div>
      <div class="col-md-6">
        <label class="form-label" for="from">Date range</label>
        <div class="input-group">
          <input class="form-control" id="from" placeholder="From" aria-label="From">
          <span class="input-group-text">–</span>
          <input class="form-control" id="to" placeholder="To" aria-label="To">
        </div>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="datetime">Date and time</label>
        <input class="form-control" id="datetime">
      </div>
      <div class="col-md-6">
        <label class="form-label" for="time">Time only, dropdowns</label>
        <input class="form-control" id="time">
      </div>
      <div class="col-md-6">
        <label class="form-label">Inline</label>
        <div id="inline"></div>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="modal-btn">Inside a modal</label>
        <div>
          <button class="btn btn-primary" id="modal-btn" type="button" data-bs-toggle="modal" data-bs-target="#modal">
            Open modal
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="modal" tabindex="-1" aria-labelledby="modal-title" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title fs-5" id="modal-title">Book a date</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <label class="form-label" for="in-modal">Date</label>
          <input class="form-control" id="in-modal">
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { Yad } from '../src/index.ts';
    import '../src/themes/bootstrap5.css'; // must load after yad.css
    window.Yad = Yad;

    new Yad('#basic');
    new Yad('#group', { showOn: 'both', buttonText: '📅' });
    new Yad('#full', { changeMonth: true, changeYear: true, showButtonPanel: true, showWeek: true, firstDay: 1 });
    new Yad('#range', { minDate: 0, maxDate: '+2m', beforeShowDay: Yad.noWeekends });
    Yad.range('#from', '#to', { minDate: 0, numberOfMonths: 2 });
    Yad.datetimepicker('#datetime', { stepMinute: 5 });
    Yad.timepicker('#time', { timeFormat: 'HH:mm', controlType: 'select', stepMinute: 15 });
    new Yad('#inline', { showButtonPanel: true });
    new Yad('#in-modal', { showButtonPanel: true });

    // Theme switcher. With the Bootstrap theme, the pickers follow Bootstrap's colour mode (data-bs-theme),
    // so the switcher sets that; "Auto" follows the operating system and updates when it changes.
    const systemDark = matchMedia('(prefers-color-scheme: dark)');
    let themeMode = 'light';
    try { themeMode = localStorage.getItem('yad-demo-bs-theme') || 'light'; } catch { /* storage unavailable */ }
    function applyTheme(mode) {
      themeMode = mode;
      document.documentElement.dataset.bsTheme = mode === 'auto' ? (systemDark.matches ? 'dark' : 'light') : mode;
      document.getElementById(`theme-${mode}`).checked = true;
      try { localStorage.setItem('yad-demo-bs-theme', mode); } catch { /* storage unavailable */ }
    }
    applyTheme(themeMode);
    systemDark.addEventListener('change', () => themeMode === 'auto' && applyTheme('auto'));
    document.querySelectorAll('input[name="theme"]').forEach((radio) => {
      radio.addEventListener('change', () => applyTheme(radio.value));
    });
  </script>
</body>
</html>
