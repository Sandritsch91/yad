<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>yad: classic script tag</title>
  <!-- Run `npm run build` first: this page uses the built files, not the sources. -->
  <link rel="stylesheet" href="../dist/yad.css">
<!--  <link rel="stylesheet" href="../dist/themes/bootstrap5.css">-->
  <style>
    :root { color-scheme: light dark; }
    body { font: 15px/1.5 system-ui, sans-serif; max-width: 760px; margin: 0 auto; padding: 24px 16px 120px; }
    section { margin: 24px 0; }
    label { display: block; font-weight: 600; margin-bottom: 4px; }
    input { font: inherit; padding: 6px 8px; }
    .theme-switcher { position: fixed; top: 12px; right: 16px; z-index: 10; display: inline-flex; margin: 0; padding: 0;
      border: 1px solid rgba(127,127,127,.45); border-radius: 8px; overflow: hidden; background: Canvas; }
    .theme-switcher legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    .theme-switcher label { padding: 4px 12px; font-size: 13px; cursor: pointer; margin-bottom: 0; }
    .theme-switcher label + label { border-left: 1px solid rgba(127,127,127,.45); }
    .theme-switcher input { position: absolute; opacity: 0; pointer-events: none; }
    .theme-switcher label:has(input:checked) { color: #fff; background: #2563eb; }
    .theme-switcher label:has(input:focus-visible) { outline: 2px solid #2563eb; outline-offset: -3px; }
  </style>
</head>
<body>
  <fieldset class="theme-switcher">
    <legend>Theme</legend>
    <label><input type="radio" name="theme" value="light"> Light</label>
    <label><input type="radio" name="theme" value="dark"> Dark</label>
    <label><input type="radio" name="theme" value="auto"> Auto</label>
  </fieldset>
  <h1>Classic &lt;script&gt; (UMD) build</h1>

  <section>
    <label for="date">Date</label>
    <input id="date">
  </section>

  <section>
    <label for="from">Date range</label>
    <input id="from" aria-label="From"> – <input id="to" aria-label="To">
  </section>

  <section>
    <label for="datetime">Date and time</label>
    <input id="datetime" size="24">
  </section>

  <section>
    <label for="datetime-de">Date and time (German, seconds, 15-minute steps, dropdowns)</label>
    <input id="datetime-de" size="24">
  </section>

  <section>
    <label for="time">Time only</label>
    <input id="time">
  </section>

  <section>
    <label>Languages</label>
    <p>
      <select id="lang" aria-label="Language"></select>
      <input id="lang-input" size="28" aria-label="Date and time in the selected language">
    </p>
    <div id="lang-inline"></div>
    <p><code>&lt;script src="yad-i18n.umd.js"&gt;&lt;/script&gt;</code> after <code>yad.umd.js</code> adds every locale to <code>yad.Yad.regional</code></p>
  </section>

  <section>
    <label>Inline (French)</label>
    <div id="calendar"></div>
  </section>

  <section>
    <label>Inline date and time</label>
    <div id="calendar-time"></div>
  </section>

  <script src="../dist/yad.umd.js"></script>
  <script src="../dist/yad-i18n.umd.js"></script>
  <script>
    var Yad = yad.Yad;

    new Yad('#date', { dateFormat: 'dd.mm.yy' });

    // Two linked pickers: the end cannot be before the start, the range is highlighted
    Yad.range('#from', '#to', { dateFormat: 'dd.mm.yy', numberOfMonths: 2 });

    // Date and time: Yad.datetimepicker() is short for new Yad(el, { showTime: true })
    Yad.datetimepicker('#datetime');

    new Yad('#datetime-de', Object.assign({}, Yad.regional.de, {
      showTime: true,
      timeFormat: 'HH:mm:ss',
      stepMinute: 15,
      controlType: 'select'
    }));

    // Time only: Yad.timepicker() is short for new Yad(el, { timeOnly: true })
    Yad.timepicker('#time', { timeFormat: 'HH:mm', stepMinute: 5 });

    new Yad('#calendar', Object.assign({}, Yad.regional.fr, { showWeek: true }));

    new Yad('#calendar-time', {
      showTime: true,
      timeFormat: 'HH:mm',
      onSelect: function (text) { console.log('selected', text); }
    });

    // Language demo
    var locales = Yad.regional;
    var langNames = new Intl.DisplayNames(['en'], { type: 'language' });
    var langSelect = document.getElementById('lang');
    Object.keys(locales).filter(function (key) { return key !== ''; }).map(function (key) {
      var name = key;
      try { name = langNames.of(key) || key; } catch (e) { /* unknown code */ }
      return { key: key, label: name + ' (' + key + ')' };
    }).sort(function (a, b) { return a.label.localeCompare(b.label); }).forEach(function (item) {
      langSelect.add(new Option(item.label, item.key));
    });
    var langPopup = new Yad('#lang-input', { showTime: true });
    var langInline = new Yad('#lang-inline', { showTime: true, numberOfMonths: 2 });
    function applyLanguage(key) {
      langPopup.option(locales[key]);
      langInline.option(locales[key]);
    }
    langSelect.value = 'ja';
    applyLanguage('ja');
    langSelect.addEventListener('change', function () { applyLanguage(langSelect.value); });

    // Theme switcher: sets the page colour scheme and the `theme` option of every picker.
    function applyTheme(mode) {
      document.documentElement.style.colorScheme = mode === 'auto' ? 'light dark' : mode;
      Yad.setDefaults({ theme: mode });
      document.querySelectorAll('[id]').forEach(function (el) {
        var dp = Yad.getInstance(el);
        if (dp) dp.option('theme', mode);
      });
      document.querySelector('.theme-switcher input[value="' + mode + '"]').checked = true;
      try { localStorage.setItem('yad-demo-theme', mode); } catch (e) { /* storage unavailable */ }
    }
    var savedTheme = null;
    try { savedTheme = localStorage.getItem('yad-demo-theme'); } catch (e) { /* storage unavailable */ }
    applyTheme(savedTheme || 'light');
    document.querySelectorAll('.theme-switcher input').forEach(function (radio) {
      radio.addEventListener('change', function () { applyTheme(radio.value); });
    });
  </script>
</body>
</html>
